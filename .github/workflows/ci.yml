name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --bin collie-barkup
      - run: python3 conformance/check.py
      - run: BARKUP_BIN=target/debug/collie-barkup bash conformance/run.sh
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: collie-barkup-ci:${{ github.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/barkup.tar
      - run: |
          set -eu
          docker load -i /tmp/barkup.tar
          docker volume create barkup-data
          trap 'docker rm -f barkup >/dev/null 2>&1 || true; docker volume rm barkup-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name barkup -e BARKUP_TOKEN=ci-token -p 18082:8082 -v barkup-data:/data collie-barkup-ci:${{ github.sha }}
          ready=0
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/health | grep -q '"ready":true'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/v1/files)" = 401
          curl -fsS http://127.0.0.1:18082/v1/files -H 'Authorization: Bearer ci-token' | grep -q '"files":{}'
          if docker logs barkup 2>&1 | grep -q 'ci-token'; then exit 1; fi
