[package]
name = "collie-barkup"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[[bin]]
name = "collie-barkup"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
bytes = "1"
cap-fs-ext = "3"
cap-std = "3"
clap = { version = "4", features = ["derive", "env"] }
http = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
fs2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
